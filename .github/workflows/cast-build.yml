name: Build Nuvio with Cast to TV

on:
  push:
    branches: [cast-to-tv]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cast-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build full release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CAST_KEYSTORE_BASE64: ${{ secrets.CAST_KEYSTORE_BASE64 }}
      CAST_LOCAL_PROPERTIES_BASE64: ${{ secrets.CAST_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure signing and runtime properties
        run: |
          keystore_path="${RUNNER_TEMP}/nuviocast.p12"
          printf '%s' "${CAST_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${CAST_LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties
          grep -Eq '^NUVIO_RELEASE_KEY_ALIAS=.+' local.properties || { echo "Missing signing properties" >&2; exit 1; }

      - name: Build full release APKs
        run: >
          ./gradlew :androidApp:assembleFullRelease
          -Pnuvio.android.distribution=full
          -Pnuvio.ios.distribution=appstore
          -Pnuvio.app.versionName=0.6.5-beta-cast
          --stacktrace

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-cast-arm64
          path: androidApp/build/outputs/apk/full/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30
