name: Build Nuvio with Cast to TV

on:
  push:
    branches: [cast-to-tv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cast-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build full release APK (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Public client configuration (the same values ship inside the official app).
      NUVIO_SUPABASE_URL: https://api.nuvio.tv
      NUVIO_SUPABASE_FALLBACK_URL: https://api-two.nuvioapp.space
      NUVIO_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare properties (temporary signing key, re-signed later)
        run: |
          keystore="${RUNNER_TEMP}/temp.p12"
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass temppass \
            -alias temp -keyalg RSA -keysize 2048 -validity 365 -dname "CN=temp" >/dev/null 2>&1
          {
            echo "NUVIO_RELEASE_STORE_FILE=${keystore}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=temppass"
            echo "NUVIO_RELEASE_KEY_ALIAS=temp"
            echo "NUVIO_RELEASE_KEY_PASSWORD=temppass"
          } > local.properties

      - name: Build full release APKs
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleFullRelease \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pnuvio.app.versionName=0.6.5-beta-cast \
            --stacktrace 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          # Full logs are not always reachable; surface the key lines as annotations.
          {
            grep -nE '^e: |^w: .*error|[^a-zA-Z]error: |ERROR:|Execution failed' build.log | grep -v '^.*> Task' | head -n 40
            grep -n -A 25 'What went wrong' build.log | head -n 60
          } > errors.txt || true
          if [ ! -s errors.txt ]; then tail -n 80 build.log > errors.txt; fi
          split -l 6 errors.txt part_
          for f in part_*; do
            msg="$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')"
            echo "::error title=build::${msg}"
          done

      - name: List outputs
        if: always()
        run: find androidApp/build/outputs -name '*.apk' -exec ls -la {} \; || true

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find androidApp/build/outputs/apk/full/release -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" nuvio-cast-arm64-tempsigned.apk
          tag="cast-build-${{ github.run_number }}"
          gh release create "$tag" nuvio-cast-arm64-tempsigned.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Nuvio Cast build ${{ github.run_number }}" \
            --notes "Temp-signed build of ${{ github.sha }}" \
            --prerelease
